name: weret_mobile
description: WERET ride-hailing mobile app (Flutter) — migrated from React Native.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  easy_localization: ^3.0.7
  url_launcher: ^6.3.1
  json_annotation: ^4.9.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "../../assets/icon.png"
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: "../../assets/adaptive-icon.png"
  web:
    generate: true
    image_path: "../../assets/icon.png"
    background_color: "#121214"
    theme_color: "#121214"

flutter_native_splash:
  color: "#121214"
  image: "../../assets/splash.png"
  android_12:
    color: "#121214"
    image: "../../assets/splash.png"
  web: true

flutter:
  uses-material-design: true
  assets:
    - ../../assets/
    - ../../assets/branding/
    - assets/branding/
    - lib/l10n/
